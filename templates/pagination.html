{% if page.has_other_pages %}<nav class="pagination" aria-label="Paginación">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}&status={{ status|urlencode }}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ q|urlencode }}&status={{ status|urlencode }}">Siguiente</a>{% endif %}</nav>{% endif %}
