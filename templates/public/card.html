{% load currency %}<article class="tool-card"><a class="tool-picture" href="/catalogo/herramientas/{{ asset.pk }}/"><img src="{{ asset.catalog_image_url }}" alt="Imagen referencial de {{ asset.category }}" width="1448" height="1086" loading="lazy" decoding="async"></a><div class="tool-content"><div class="tool-category">{{ asset.category }}</div><h3><a href="/catalogo/herramientas/{{ asset.pk }}/">{{ asset.name }}</a></h3><p class="availability {% if asset.requestable %}available{% endif %}">{{ asset.public_availability }}</p><div class="tool-bottom"><p class="price">{{ asset.daily_rate|clp }} <small>/ día</small></p><a class="detail-link" href="/catalogo/herramientas/{{ asset.pk }}/">Ver herramienta</a></div></div></article>
