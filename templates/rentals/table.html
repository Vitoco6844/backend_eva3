<div class="table-wrap"><table><thead><tr><th>Préstamo</th><th>Contratista</th><th>Obra</th><th>Devolución prevista</th><th>Estado</th></tr></thead><tbody>{% for loan in rows %}<tr><td><a class="row-title" href="/rentals/{{ loan.pk }}/">#{{ loan.pk }}</a></td><td>{{ loan.contractor }}</td><td>{{ loan.site }}</td><td>{{ loan.due_at|date:'d/m/Y H:i' }}</td><td><span class="badge">{% if loan.closed_at %}Cerrado{% else %}En curso{% endif %}</span></td></tr>{% empty %}<tr><td colspan="5" class="empty">No hay préstamos para mostrar.</td></tr>{% endfor %}</tbody></table></div>
